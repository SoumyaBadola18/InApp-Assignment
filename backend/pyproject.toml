[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "bcrypt==4.3.0",
    "blinker==1.8.2",
    "click==8.1.8",
    "flask==3.0.3",
    "flask-cors==5.0.0",
    "flask-jwt-extended==4.6.0",
    "flask-sqlalchemy==3.1.1",
    "importlib-metadata==8.5.0",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "markupsafe==2.1.5",
    "numpy==1.24.4",
    "pandas==2.0.3",
    "passlib==1.7.4",
    "pyjwt==2.9.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.0.1",
    "pytz==2025.2",
    "six==1.17.0",
    "sqlalchemy==2.0.41",
    "tqdm==4.67.1",
    "typing-extensions==4.13.2",
    "tzdata==2025.2",
    "werkzeug==3.0.6",
    "zipp==3.20.2"
]
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.packages.find]
where = ["src"]